name: Validate Python and Godot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q

      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.2"
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        run: godot --version

      - name: Compile and smoke-test Godot
        run: python scripts/check_godot.py --godot godot
